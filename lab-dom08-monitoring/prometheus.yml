# Rendered copy of prometheus/prometheus.yml.tpl as actually deployed on
# the monitoring host (values filled in by Terraform.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "server_details_app"
    metrics_path: /metrics
    ec2_sd_configs:
      - region: eu-west-1
        port: 3000
        filters:
          - name: tag:Name
            values: ["lab-dom08-app"]
          - name: vpc-id
            values: ["vpc-0220afc4858ff63df"]
          - name: instance-state-name
            values: ["running"]
    relabel_configs:
      - target_label: instance_role
        replacement: app

  - job_name: "node_exporter"
    ec2_sd_configs:
      - region: eu-west-1
        port: 9100
        filters:
          - name: tag:Name
            values: ["lab-dom08-app"]
          - name: vpc-id
            values: ["vpc-0220afc4858ff63df"]
          - name: instance-state-name
            values: ["running"]
    relabel_configs:
      - target_label: instance_role
        replacement: app
