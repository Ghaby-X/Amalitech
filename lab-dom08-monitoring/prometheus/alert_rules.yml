groups:
  - name: app-alerts
    rules:
      - alert: HighErrorRate
        expr: >
          (sum(rate(http_requests_total{status_code=~"5.."}[2m]))
            /
           sum(rate(http_requests_total[2m])))
          > 0.05
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate on server_details_app"
          description: >
            The 5xx error rate over the last 2 minutes is
            {{ $value | humanizePercentage }}, above the 5% threshold.
            Hit GET /api/fail on the app repeatedly to reproduce this
            for a screenshot, then stop to let it resolve.

      - alert: AppTargetDown
        expr: up{job="server_details_app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "server_details_app is not being scraped"
          description: "Prometheus has not been able to scrape /metrics on the app host for over a minute."
