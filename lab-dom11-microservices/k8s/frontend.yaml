apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 182399707265.dkr.ecr.eu-west-1.amazonaws.com/lab-dom11-shopnow/frontend:c1c5b55
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: BACKEND_SERVICE
              value: shopnow-backend
            - name: SERVICE_NAME
              value: shopnow-frontend
            - name: LOG_LEVEL
              value: INFO
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shopnow-secrets
                  key: frontend-secret-key
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: shopnow-frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
