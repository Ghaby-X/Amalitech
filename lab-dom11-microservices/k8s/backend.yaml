apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # no imagePullSecrets - EKS node role already has ECR pull rights
      containers:
        - name: backend
          image: 182399707265.dkr.ecr.eu-west-1.amazonaws.com/lab-dom11-shopnow/backend:c1c5b55
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: shopnow
            - name: PGDATABASE
              value: shopnow
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_TLS
              value: "true"
            - name: CART_COOKIE_NAME
              value: cart_id
            - name: CART_TTL_SECONDS
              value: "86400"
            - name: SERVICE_NAME
              value: shopnow-backend
            - name: LOG_LEVEL
              value: INFO
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopnow-secrets
                  key: postgres-password
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: shopnow-backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
