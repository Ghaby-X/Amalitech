global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
- /etc/prometheus/alert_rules.yml

scrape_configs:
- job_name: prometheus
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /metrics
  scheme: http
  static_configs:
  - targets:
    - localhost:9090

- job_name: server_details_app
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /metrics
  ec2_sd_configs:
  - endpoint: ""
    region: eu-west-1
    refresh_interval: 1m
    port: 3000
    filters:
    - name: tag:Name
      values:
      - lab-dom08-app
    - name: vpc-id
      values:
      - vpc-0220afc4858ff63df
    - name: instance-state-name
      values:
      - running

- job_name: node_exporter
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /metrics
  ec2_sd_configs:
  - endpoint: ""
    region: eu-west-1
    refresh_interval: 1m
    port: 9100
    filters:
    - name: tag:Name
      values:
      - lab-dom08-app
    - name: vpc-id
      values:
      - vpc-0220afc4858ff63df
    - name: instance-state-name
      values:
      - running

- job_name: server_details_app_otel
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /metrics
  ec2_sd_configs:
  - endpoint: ""
    region: eu-west-1
    refresh_interval: 1m
    port: 3001
    filters:
    - name: tag:Name
      values:
      - lab-dom08-app
    - name: vpc-id
      values:
      - vpc-0220afc4858ff63df
    - name: instance-state-name
      values:
      - running

