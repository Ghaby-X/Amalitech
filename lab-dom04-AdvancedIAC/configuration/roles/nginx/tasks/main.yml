---
- name: Debug OS family
  ansible.builtin.debug:
    var: ansible_facts['os_family']

- name: Load OS-family-specific variables (falls back to role defaults if none exist)
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts['os_family'] }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true

- name: Ensure nginx is installed
  ansible.builtin.package:
    name: "{{ nginx_package_name }}"
    state: present
    update_cache: "{{ nginx_package_update_cache }}"

- name: Remove default Nginx server block
  ansible.builtin.file:
    path: "{{ nginx_default_conf_path }}"
    state: absent
  notify: Reload nginx

- name: Deploy Nginx reverse proxy configuration
  ansible.builtin.template:
    src: "{{ nginx_template }}"
    dest: "{{ nginx_site_conf_path }}"
    owner: root
    group: root
    mode: '0644'
  when: nginx_template is defined and nginx_site_conf_path is defined
  notify: Reload nginx

- name: Validate full Nginx configuration
  ansible.builtin.command: nginx -t -c /etc/nginx/nginx.conf
  when: nginx_template is defined and nginx_site_conf_path is defined
  changed_when: false

- name: Enable site via sites-enabled symlink
  ansible.builtin.file:
    src: "{{ nginx_site_conf_path }}"
    dest: "{{ nginx_site_conf_link_path }}"
    state: link
  when: nginx_template is defined and nginx_site_conf_path is defined and nginx_needs_enabled_symlink
  notify: Reload nginx

- name: Ensure nginx is started and enabled
  ansible.builtin.service:
    name: nginx
    state: "{{ nginx_service_state }}"
    enabled: "{{ nginx_service_enabled }}"
