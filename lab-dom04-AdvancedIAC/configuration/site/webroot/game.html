<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Guessing Game - Lab DOM04</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>Guess the Number</h1>
  <p>I'm thinking of a number between 1 and 100. You have 5 tries.</p>

  <input type="number" id="guess" min="1" max="100">
  <button id="submit">Guess</button>
  <button id="reset">Reset</button>

  <p id="message"></p>
  <p id="tries"></p>

  <p><a href="/">Home</a></p>

  <script>
    let target;
    let triesLeft;
    const maxTries = 5;

    function reset() {
      target = Math.floor(Math.random() * 100) + 1;
      triesLeft = maxTries;
      document.getElementById('message').textContent = '';
      document.getElementById('tries').textContent = `Tries left: ${triesLeft}`;
      document.getElementById('guess').disabled = false;
      document.getElementById('guess').value = '';
      document.getElementById('submit').disabled = false;
    }

    function checkGuess() {
      const input = document.getElementById('guess');
      const guess = Number(input.value);
      const message = document.getElementById('message');

      if (!guess || guess < 1 || guess > 100) {
        message.textContent = 'Enter a number between 1 and 100.';
        return;
      }

      triesLeft--;

      if (guess === target) {
        message.textContent = `Correct! The number was ${target}.`;
        endGame();
      } else if (triesLeft === 0) {
        message.textContent = `Out of tries. The number was ${target}.`;
        endGame();
      } else if (guess < target) {
        message.textContent = 'Higher!';
      } else {
        message.textContent = 'Lower!';
      }

      document.getElementById('tries').textContent = `Tries left: ${triesLeft}`;
    }

    function endGame() {
      document.getElementById('guess').disabled = true;
      document.getElementById('submit').disabled = true;
    }

    document.getElementById('submit').addEventListener('click', checkGuess);
    document.getElementById('reset').addEventListener('click', reset);

    reset();
  </script>
</body>
</html>
